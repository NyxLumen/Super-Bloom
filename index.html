<!doctype html>
<html lang="en">
	<head>
		<meta charset="UTF-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1.0" />
		<title>SUPER BLOOM '26</title>

		<link rel="preconnect" href="https://fonts.googleapis.com" />
		<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
		<link
			href="https://fonts.googleapis.com/css2?family=Abril+Fatface&family=Bangers&family=Cinzel:wght@900&family=Creepster&family=Dancing+Script:wght@700&family=Inter:wght@400;600&family=Orbitron:wght@900&family=VT323&display=swap"
			rel="stylesheet"
		/>

		<link rel="stylesheet" href="style.css" />
	</head>
	<body>
		<section class="hero-loki">
			<div class="loki-container">
				<h1 id="loki-text" class="loki-text">SUPER BLOOM</h1>
				<p class="hero-sub">MAY 03 • NYC</p>
			</div>
		</section>

		<section class="artist-highlight section-padding">
			<div class="container">
				<div class="artist-showcase">
					<div class="video-bg-wrapper">
						<video class="video-bg" autoplay muted loop playsinline>
							<source
								src="https://videos.pexels.com/video-files/3121459/3121459-hd_1920_1080_25fps.mp4"
								type="video/mp4"
							/>
						</video>
						<div class="video-overlay"></div>
					</div>

					<div class="artist-content">
						<div class="artist-portrait-wrapper">
							<img
								src="https://images.unsplash.com/photo-1520333789090-1afc82db536a?q=80&w=1000&auto=format&fit=crop"
								alt="April Portrait"
								class="artist-portrait"
							/>
						</div>

						<div class="artist-info">
							<h2 class="artist-name">APRIL</h2>
							<p class="artist-genre">ORIGINS: UNKNOWN</p>
							<button class="btn-spotify">LISTEN ON SPOTIFY</button>
						</div>
					</div>
				</div>
			</div>
		</section>

		<script type="module" src="/src/main.js"></script>
	</body>
</html>
